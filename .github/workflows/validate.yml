name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate.py
      - run: python scripts/evaluate.py validate
      - run: python -m unittest discover -s evals -p 'test_*.py' -v
  diagrams:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/explain/scripts/diagrams
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm ci --ignore-scripts --no-fund --prefix ../../../../examples/pele-diagram
      - run: npm test --prefix ../../../../examples/pele-diagram
      - run: npm audit --prefix ../../../../examples/pele-diagram
